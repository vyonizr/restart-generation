# The public server: Caddy serves https://${RG_DOMAIN} with a certificate it gets and renews itself, and is the only way in.
# The gateway publishes no port. For a private network use compose.lan.yaml instead. See "Run in Docker" in docs/HOSTING.md.
services:
  rg:
    build:
      context: .
      args:
        # The release that /status reports (ADR 0019). Start with RG_VERSION=$(git describe --tags --always) in front.
        RG_VERSION: ${RG_VERSION:-unknown}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # The server copy, set only if RG_GAME_PATH is set: the witness runs it to decide battle results (docs/adr/0020). A public
      # server never runs bots, and sends it only for its download code (npm run download-code, docs/adr/0031).
      RG_GAME: ${RG_GAME_PATH:+/game}
      # What the download code may send in a day, in MiB. Empty is 700.
      RG_GAME_MB_PER_DAY: ${RG_GAME_MB_PER_DAY:-}
      # Guests and members: all three are needed (see docs/HOSTING.md). The address defaults to the domain Caddy serves.
      RG_DISCORD_CLIENT_ID: ${RG_DISCORD_CLIENT_ID:-}
      RG_DISCORD_CLIENT_SECRET: ${RG_DISCORD_CLIENT_SECRET:-}
      RG_PUBLIC_URL: ${RG_PUBLIC_URL:-https://${RG_DOMAIN:?Set RG_DOMAIN in .env, for example play.example.com}}
      RG_DISCORD_INVITE: ${RG_DISCORD_INVITE:-}
      # Who runs the server, who stores its data, and where players and rights holders write: they fill in its Terms and Privacy
      # policy, and the server won't start without all three (docs/adr/0021).
      RG_ADMIN_NAME: ${RG_ADMIN_NAME:-}
      RG_HOSTING: ${RG_HOSTING:-}
      RG_CONTACT: ${RG_CONTACT:-}
      # One proxy (Caddy) sits in front, and nothing else can reach the gateway, so its X-Forwarded-For can be trusted.
      RG_TRUST_PROXY: ${RG_TRUST_PROXY:-1}
      # The admin's account delete and download code (npm run delete-user, npm run download-code). Unset, the endpoint is off;
      # Caddy never forwards /admin/ anyway.
      RG_ADMIN_TOKEN: ${RG_ADMIN_TOKEN:-}
      # 0 keeps no replays and serves none of those kept (docs/HOSTING.md "Replays"). Empty keeps them.
      RG_REPLAYS: ${RG_REPLAYS:-}
      # 1 counts visitor statistics, which only you see with `docker compose exec rg npm run stats` (docs/HOSTING.md "Visitor
      # statistics"). Empty leaves them off.
      RG_STATS: ${RG_STATS:-}
    volumes:
      - ./data:/app/data
      # With no RG_GAME_PATH, this mounts an empty file that the server ignores.
      - ${RG_GAME_PATH:-/dev/null}:/game:ro
    # Docker keeps a container's output forever by default; the server logs most requests, so keep 3 files of 10 MB. The Privacy
    # policy says the game server's newest 50 MB of logs are kept: these 30 MB and data/capture.log's 20 MB.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - rg
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RG_DOMAIN: ${RG_DOMAIN:?Set RG_DOMAIN in .env, for example play.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and Caddy's state. Losing them only means asking Let's Encrypt again.
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
